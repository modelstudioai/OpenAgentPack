# Bailian Managed multi-agent example: a coordinator that delegates to
# researcher, writer, and an existing external reviewer. Locally declared
# agents materialize as Managed Agents. Replace `agent_external_reviewer` with
# an Agent id accessible to your Bailian workspace before applying this example.
#
# Bailian runs child agents in PARALLEL over a SHARED file system: files
# written by one member are visible to the others. The coordinator's
# instructions should declare file ownership to avoid two members writing
# the same path.
#
# Phase 1 rules enforced at plan time:
# - logical-name members must be declared in this file; external ids are non-owned
# - no self reference, no nesting, no direct or indirect cycles
# - at most 20 members per coordinator
version: "1"

providers:
  bailian:
    api_key: ${DASHSCOPE_API_KEY}
    workspace_id: ${BAILIAN_WORKSPACE_ID}

defaults:
  provider: bailian

environments:
  dev:
    config:
      type: cloud
      networking:
        type: unrestricted

agents:
  researcher:
    description: "Gathers information from the codebase"
    model: qwen3.7-max
    instructions: |
      You are a research agent. Your job is to gather relevant information
      from the codebase when asked. Use glob and grep to find files, then
      read them to extract the needed context.

      Only write files under /work/research/. Never touch /work/report/.
    environment: dev
    tools:
      builtin: [read, glob, grep, web_search]

  writer:
    description: "Writes documentation and summaries"
    model: qwen3.7-max
    instructions: |
      You are a technical writer. Given research findings, produce clear
      and concise documentation, summaries, or reports.

      Only write files under /work/report/. Never touch /work/research/.
    environment: dev
    tools:
      builtin: [read, glob, grep]

  lead:
    description: "Coordinates local agents and an external reviewer"
    model: qwen3.7-max
    instructions: |
      You are the lead agent coordinating a team:
      - researcher: can search code and the web for information,
        owns /work/research/
      - writer: can produce documentation from findings,
        owns /work/report/
      - external reviewer: can independently review the proposed result

      Child agents run in parallel and share one file system, so keep each
      member inside its own directory. Break tasks into research and writing
      phases, delegate, then synthesize their outputs into /work/report/.
    environment: dev
    tools:
      builtin: [read, glob, grep]
    multiagent:
      type: coordinator
      agents:
        - researcher
        - writer
        - agent_id: agent_external_reviewer
